server.port=8083

# 활성 프로파일: 로컬은 기본값(local)으로 동작, 배포 서버는 SPRING_PROFILES_ACTIVE=prod로 오버라이드
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# producer가 타입 헤더를 안 보내므로, 헤더를 신뢰하지 않고 이 서비스 소유의 OrderPlacedEvent로 고정 매핑해서 역직렬화
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.seokwon.notiflow.notify.event.OrderPlacedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.seokwon.notiflow.notify.event

# notify-events 발행용 producer 설정 (저장 완료된 알림을 gateway로 실시간 전달)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000
