server.port=8083

# =========================
# 데이터베이스 (개발용 PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# Redis 설정
spring.redis.host=localhost
spring.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notify-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# producer가 타입 헤더를 안 보내므로, 헤더를 신뢰하지 않고 이 서비스 소유의 OrderPlacedEvent로 고정 매핑해서 역직렬화
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.seokwon.notiflow.notify.event.OrderPlacedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.seokwon.notiflow.notify.event

# notification-events 발행용 producer 설정 (저장 완료된 알림을 gateway로 실시간 전달)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

jwt.secret=${JWT_SECRET:changeme-local-dev-secret}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000
