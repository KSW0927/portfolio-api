# 로컬 개발용 설정 - 기본값만으로 별도 .env 없이도 대충 동작하게 잡아둠

# 데이터베이스
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# 배포 Kafka를 같이 볼 때 배포 컨테이너랑 컨슈머 그룹이 겹치지 않게 로컬 전용 group-id 사용
spring.kafka.consumer.group-id=notify-service-local

# JWT 암호화용 비밀키 (로컬 기본값 - 운영에는 절대 이 값 쓰면 안 됨)
jwt.secret=${JWT_SECRET:changeme-local-dev-secret}

# CORS - 로컬 프론트(Vite dev server), CommonSecurityConfig가 읽음
cors.allowed-origin=http://localhost:3000
