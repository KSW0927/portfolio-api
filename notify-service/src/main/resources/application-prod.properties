# 배포(오라클 클라우드)용 설정 - 기본값 없이 전부 환경변수로 주입받음(빠뜨리면 기동 실패로 바로 알 수 있게)

# 데이터베이스
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 별도 마이그레이션 도구(Flyway 등)가 없어서 update 유지. 스키마 안정화되면 validate로 바꾸는 걸 권장.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=notify-service

# JWT 암호화용 비밀키 (기본값 없음 - 반드시 실제 값 주입, 다른 서비스와 동일한 값이어야 함)
jwt.secret=${JWT_SECRET}

# CORS - 실제 배포된 프론트 도메인, CommonSecurityConfig가 읽음
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
