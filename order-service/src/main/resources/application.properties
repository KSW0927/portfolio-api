server.port=8082

# =========================
# 데이터베이스 (개발용 PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# show-sql=true는 로거를 안 거치고 stdout에 그냥 println 하기 때문에 로그레벨로 끌 수가 없음 - 꺼둠.
# SQL을 다시 보고싶으면 아래 org.hibernate.SQL 레벨만 debug로 바꾸면 됨(로거 기반이라 필요할 때만 켤 수 있음).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# 로그 레벨 - 평소엔 SQL/바인딩 파라미터 숨기고, 우리 코드 로그(에러 포함)만 잘 보이게
logging.level.root=INFO
logging.level.com.seokwon.notiflow=INFO
# SQL 쿼리를 다시 보고싶을 때만 아래 두 줄을 debug/trace로 바꾸기
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# =========================
# Redis 설정
spring.redis.host=localhost
spring.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# 메시지 헤더에 producer 쪽 풀패키지 클래스명을 넣지 않음 - notify-service는 자체 사본 클래스로 역직렬화하므로 헤더 기반 매핑이 불필요/방해가 됨
spring.kafka.producer.properties.spring.json.add.type.headers=false

jwt.secret=${JWT_SECRET:changeme-local-dev-secret}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000
