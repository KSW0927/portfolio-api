server.port=8084

# 활성 프로파일: 로컬은 기본값(local)으로 동작, 배포 서버는 SPRING_PROFILES_ACTIVE=prod로 오버라이드
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Kafka 설정
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.seokwon.notiflow.gateway.event.NotifyPublishedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.seokwon.notiflow.gateway.event
