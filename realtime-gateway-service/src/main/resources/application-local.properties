# 로컬 개발용 설정

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# 배포 Kafka를 같이 볼 때 배포 컨테이너랑 컨슈머 그룹이 겹치지 않게 로컬 전용 group-id 사용
spring.kafka.consumer.group-id=realtime-gateway-service-local

# CORS/WebSocket 허용 origin - 로컬 프론트(Vite dev server)
cors.allowed-origin=http://localhost:3000
