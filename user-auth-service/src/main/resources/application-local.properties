# 로컬 개발용 설정 - 기본값만으로 별도 .env 없이도 대충 동작하게 잡아둠

# 데이터베이스
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis 설정
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# JWT 암호화용 비밀키 (로컬 기본값 - 운영에는 절대 이 값 쓰면 안 됨)
jwt.secret=${JWT_SECRET:changeme-local-dev-secret}

# CORS - 로컬 프론트(Vite dev server)
cors.allowed-origin=http://localhost:3000
