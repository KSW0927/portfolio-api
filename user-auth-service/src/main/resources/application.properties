# =========================
# 서버
server.port=8081

# =========================
# 데이터베이스 (개발용 PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# Redis 설정
spring.redis.host=localhost
spring.redis.port=6379

# =========================
# JWT 토큰 설정
# Access Token 만료시간 (1시간)
jwt.access-token-expiration=3600000
# Refresh Token 만료시간 (7일)
jwt.refresh-token-expiration=604800000
# JWT 암호화용 비밀키 (운영 환경에서는 반드시 환경변수로 주입)
jwt.secret=${JWT_SECRET:changeme-local-dev-secret}
